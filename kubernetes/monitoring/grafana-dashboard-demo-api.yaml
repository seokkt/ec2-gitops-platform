apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-demo-api
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ec2-gitops-project
data:
  demo-api.json: |
    {
      "annotations": {
        "list": []
