          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (endpoint) (rate(http_requests_total[1m]))",
              "legendFormat": "{{endpoint}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request Rate by Endpoint",
          "type": "timeseries"
        }
