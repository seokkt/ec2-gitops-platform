              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))",
              "instant": true,
              "legendFormat": "p95",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "P95 Request Latency",
          "type": "stat"
